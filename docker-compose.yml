# nast 本地 Docker 部署（仅核心服务）。
#
# 使用：
#   1. docker compose up -d --build
#   2. 浏览器打开 http://127.0.0.1:8000 导入角色卡并配置 API 连接
#
# IM 桥接（QQ/Discord/飞书）在独立仓库 nast-bridges，经 nast-net 网络接入。
# 网络显式命名为 nast-net，供 nast-bridges 的 compose external 引用。

services:
  nast:
    build:
      context: .
      dockerfile: Dockerfile
    image: nast:local
    container_name: nast
    environment:
      NAST_BIND: 0.0.0.0
      NAST_PORT: 8000
      NAST_PLUGIN_TIMEOUT_SECS: ${NAST_PLUGIN_TIMEOUT_SECS:-10}
    ports:
      - "${NAST_PORT:-8000}:8000"
    volumes:
      # 数据目录（settings/secrets/角色卡/聊天/世界书/预设/插件 KV）
      - nast-data:/app/data
      # 如需本机管理插件可直接挂载：./plugins:/app/plugins
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  nast-data:

networks:
  default:
    name: nast-net
