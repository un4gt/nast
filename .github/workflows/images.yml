name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Tests and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            nast-bridges -> target
      - name: Rust workspace tests
        run: |
          cargo test --workspace --locked
          cargo test --manifest-path nast-bridges/Cargo.toml --workspace --locked
          cargo build --bin nast --locked
      - name: Frontend typecheck and build
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/parity/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Real HTTP onboarding, authentication and routing
        run: |
          export NAST_E2E_HTTP_HOST="$(hostname -I | cut -d' ' -f1)"
          python tests/parity/model_setup.py
          python tests/parity/model_sync.py
          python tests/parity/auth.py
          python tests/parity/routing.py
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          retention-days: 7
          path: |
            /tmp/nast-model-setup-*/
            /tmp/nast-model-sync-*/
            /tmp/nast-auth-*/
            /tmp/nast-routing-*/

  publish:
    needs: verify
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nast
            context: .
            dockerfile: ./Dockerfile
            suffix: ""
          - image: nast-bridges
            context: ./nast-bridges
            dockerfile: ./nast-bridges/Dockerfile
            suffix: "-bridges"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        env:
          IMAGE_SUFFIX: ${{ matrix.suffix }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.image }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64

      - name: Verify startup, migration and restart
        if: matrix.image == 'nast'
        # The container writes private files as root in the disposable bind mount.
        run: sudo python3 tests/parity/container_migration.py --image nast:ci

      - name: Verify bridge runtime libraries and licenses
        if: matrix.image == 'nast-bridges'
        run: |
          docker run --rm --entrypoint sh nast-bridges:ci -ec '
            for binary in bridge-qq bridge-discord bridge-feishu; do
              result="$(ldd "/usr/local/bin/$binary")"
              printf "%s\n" "$result"
              case "$result" in *"not found"*) exit 1;; esac
            done
            test -s /usr/share/licenses/qqbot-connector/LICENSE-MIT
            test -s /usr/share/licenses/qqbot-connector/LICENSE-APACHE
          '

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-amd64

      - name: Record published digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### GHCR image'
            echo
            printf '%s@%s\n\n' "$IMAGE" "$DIGEST"
            printf '%s\n' "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
